# CI（継続的インテグレーション）
# - プッシュやPR時に自動でテストやビルドを行います
name: CI

on:
  push:
    branches: [ main, master, feat/**, fix/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  go:
    # Go版のビルドとテストを行うジョブ
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # リポジトリのコードを取得
      - name: Install sqlite3 dev  # SQLite3 のヘッダ等（CGO用）を導入
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: actions/setup-go@v5   # Go をセットアップ
        with:
          go-version: '1.20.x'
      - name: Go modules tidy        # Go Modules を整える
        run: go mod tidy
      - name: Test                   # 単体テストを実行
        run: go test -v ./...
      - name: Build                  # バイナリをビルド（./clip）
        run: go build -o clip ./...

  python:
    # Python版（移植版スキャフォールド）のテストとビルド
    name: Python Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4  # リポジトリのコードを取得
      - uses: actions/setup-python@v5  # Python をセットアップ
        with:
          python-version: '3.11'
      - name: Install tools          # パッケージのインストール（開発モード）とビルドツール
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest build
      - name: Run tests              # Pytest を実行
        run: pytest
      - name: Build package          # sdist/wheel を作成
        run: python -m build
      - name: Upload dist            # 生成物をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: py-dist
          path: dist/*
