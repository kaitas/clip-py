name: CI

on:
  push:
    branches: [ main, master, feat/**, fix/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlite3 dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Dependencies
        run: make deps
      - name: Test
        run: make test
      - name: Build
        run: make build

  python:
    name: Python Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest build
      - name: Run tests
        run: pytest
      - name: Build package
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: py-dist
          path: dist/*

