# Release（リリース自動化）
# - タグを push したときにGoバイナリとPythonパッケージをビルドし、
#   GitHub Releaseを作成、必要に応じてPyPIへ公開します。
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-go:
    # macOS向けのGoバイナリをビルド（x86_64/arm64）
    name: Build Go (macOS)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            goarch: amd64
          - os: macos-14
            goarch: arm64
    steps:
      - uses: actions/checkout@v4   # コードを取得
      - uses: actions/setup-go@v5   # Go をセットアップ
        with:
          go-version: '1.20.x'
      - name: Install deps           # 依存関係の解決
        run: make deps
      - name: Build                  # dist/ にバイナリを作成
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -o dist/clip-darwin-${{ matrix.goarch }}
      - name: Upload artifact        # 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: clip-darwin-${{ matrix.goarch }}
          path: dist/clip-darwin-${{ matrix.goarch }}

  build-py:
    # Python パッケージ（sdist/wheel）をビルド
    name: Build Python Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4   # コードを取得
      - uses: actions/setup-python@v5  # Python をセットアップ
        with:
          python-version: '3.11'
      - name: Build                  # dist/ に sdist/wheel を作成
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Upload artifact        # 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: py-dist
          path: dist/*

  release:
    # GitHub Release を作成し、ビルド成果物を添付
    name: Create GitHub Release
    needs: [build-go, build-py]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts     # 先行ジョブのアーティファクトを取得
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release         # Release を作成してファイルを添付
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    # PyPI API トークンが設定されている場合のみPyPIへ公開
    if: ${{ startsWith(github.ref, 'refs/tags/') && secrets.PYPI_API_TOKEN != '' }}
    name: Publish to PyPI
    needs: build-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Python dist   # Python の dist/ を取得
        uses: actions/download-artifact@v4
        with:
          name: py-dist
          path: dist
      - name: Publish                # PyPI に公開
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: dist
